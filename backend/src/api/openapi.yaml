openapi: '3.0.3'
info:
  title: SEOIndicator API
  version: '1.0.0'
  description: |
    SEOIndicator is a comprehensive SEO analysis and monitoring platform. 
    This API provides endpoints for keyword tracking, site auditing, 
    competitor analysis, reporting, and AI-powered SEO insights.
    
    ## Authentication
    
    Most endpoints require authentication using either:
    - **Bearer Token (JWT)**: For user sessions via Laravel Sanctum
    - **API Key**: For programmatic access via X-API-Key header
    
    ## Rate Limiting
    
    API requests are rate-limited to ensure fair usage. Specific limits are 
    documented per endpoint group.
    
    ## Pagination
    
    List endpoints support pagination via `page` and `per_page` parameters.
    Responses include pagination metadata.
  contact:
    name: SEOIndicator Support
    email: support@seoindicator.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://seoindicator.com/terms

servers:
  - url: https://api.seoindicator.com
    description: Production server
  - url: https://staging-api.seoindicator.com
    description: Staging server
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Keywords
    description: Keyword tracking and management
  - name: Sites
    description: Site management and dashboard
  - name: Projects
    description: Project management
  - name: Reports
    description: Report generation and management
  - name: Audits
    description: SEO audit management
  - name: Competitors
    description: Competitor tracking and analysis
  - name: Analysis
    description: Analysis jobs and workflows
  - name: AI Visibility
    description: AI-powered visibility tracking
  - name: Admin
    description: Administrative endpoints
  - name: Payments
    description: Payment and billing management
  - name: Webhooks
    description: Webhook management
  - name: Public
    description: Public endpoints (no authentication required)
  - name: GSC
    description: Google Search Console integration
  - name: Local SEO
    description: Local SEO and GBP management
  - name: Content Decay
    description: Content decay detection and refresh

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication via Laravel Sanctum
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access

  schemas:
    # Common Schemas
    Error:
      type: object
      description: Standard error response object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Error message
          example: "Resource not found"
        status:
          type: integer
          description: HTTP status code
          example: 404
        errors:
          type: object
          description: Validation errors (if applicable)
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      description: Pagination metadata for list responses
      properties:
        total:
          type: integer
          example: 100
          description: Total number of items
        per_page:
          type: integer
          example: 15
          description: Items per page
        current_page:
          type: integer
          example: 1
          description: Current page number
        last_page:
          type: integer
          example: 7
          description: Last page number
        from:
          type: integer
          example: 1
          description: First item index
        to:
          type: integer
          example: 15
          description: Last item index

    # User Schemas
    User:
      type: object
      description: User account information
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserResponse:
      type: object
      description: Single user response
      properties:
        data:
          $ref: '#/components/schemas/User'

    # Site/Project Schemas
    Site:
      type: object
      description: Site/website resource
      required:
        - id
        - name
        - url
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "My Website"
        url:
          type: string
          format: uri
          example: "https://example.com"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      description: SEO project resource
      required:
        - id
        - name
        - url
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "SEO Project"
        url:
          type: string
          format: uri
          example: "https://example.com"
        is_archived:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Keyword Schemas
    Keyword:
      type: object
      description: Keyword tracking resource
      required:
        - id
        - keyword
        - site_id
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        keyword:
          type: string
          example: "seo tools"
        site_id:
          type: integer
          example: 1
          minimum: 1
        current_position:
          type: integer
          nullable: true
          example: 5
        previous_position:
          type: integer
          nullable: true
          example: 7
        search_volume:
          type: integer
          nullable: true
          example: 10000
        difficulty:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          example: 45
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KeywordResponse:
      type: object
      description: Single keyword response
      properties:
        data:
          $ref: '#/components/schemas/Keyword'

    KeywordListResponse:
      type: object
      description: Paginated list of keywords
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # Report Schemas
    Report:
      type: object
      description: SEO report resource
      required:
        - id
        - site_id
        - type
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        site_id:
          type: integer
          example: 1
          minimum: 1
        type:
          type: string
          enum: [weekly, monthly, custom]
          example: "weekly"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "completed"
        generated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportResponse:
      type: object
      description: Single report response
      properties:
        data:
          $ref: '#/components/schemas/Report'

    # Audit Schemas
    Audit:
      type: object
      description: SEO audit resource
      required:
        - id
        - site_id
        - status
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        site_id:
          type: integer
          example: 1
          minimum: 1
        status:
          type: string
          enum: [pending, running, completed, failed]
          example: "completed"
        score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 85
        issues_count:
          type: integer
          example: 12
        critical_issues:
          type: integer
          example: 2
        warning_issues:
          type: integer
          example: 5
        info_issues:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditIssue:
      type: object
      description: SEO audit issue
      required:
        - id
        - audit_id
        - type
        - severity
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        audit_id:
          type: integer
          example: 1
          minimum: 1
        type:
          type: string
          example: "missing_meta_description"
        severity:
          type: string
          enum: [critical, warning, info]
          example: "warning"
        message:
          type: string
          example: "Page is missing meta description"
        url:
          type: string
          format: uri
          example: "https://example.com/page"
        status:
          type: string
          enum: [open, ignored, fixed]
          example: "open"

    # Competitor Schemas
    Competitor:
      type: object
      description: Competitor resource
      required:
        - id
        - name
        - url
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "Competitor Inc"
        url:
          type: string
          format: uri
          example: "https://competitor.com"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Analysis Job Schemas
    AnalysisJob:
      type: object
      description: Analysis job resource
      required:
        - id
        - site_id
        - status
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        site_id:
          type: integer
          example: 1
          minimum: 1
        status:
          type: string
          enum: [pending, running, completed, failed]
          example: "completed"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # AI Visibility Project Schema
    AIVisibilityProject:
      type: object
      description: AI visibility tracking project
      required:
        - id
        - name
        - brand_name
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "Brand Visibility Project"
        brand_name:
          type: string
          example: "My Brand"
        queries_count:
          type: integer
          example: 50
        visibility_score:
          type: number
          format: float
          example: 75.5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Webhook Schema
    Webhook:
      type: object
      description: Webhook subscription
      required:
        - id
        - url
        - events
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        url:
          type: string
          format: uri
          example: "https://example.com/webhook"
        events:
          type: array
          items:
            type: string
          example: ["keyword.position_changed", "audit.completed"]
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # API Key Schema
    ApiKey:
      type: object
      description: API key for programmatic access
      required:
        - id
        - name
        - key
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "Production API Key"
        key:
          type: string
          example: "sk_live_xxxxx"
        permissions:
          type: array
          items:
            type: string
          example: ["keywords:read", "keywords:write"]
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # Dashboard Stats Schema
    DashboardStats:
      type: object
      description: Dashboard statistics
      properties:
        total_keywords:
          type: integer
          example: 150
        average_position:
          type: number
          format: float
          example: 12.5
        position_changes:
          type: object
          properties:
            improved:
              type: integer
              example: 25
            declined:
              type: integer
              example: 10
            unchanged:
              type: integer
              example: 115
        top_keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'

    # Health Check Schema
    HealthStatus:
      type: object
      description: System health status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]
            cache:
              type: string
              enum: [connected, disconnected]
            queue:
              type: string
              enum: [running, stopped]

    # Ranking History Schema
    RankingHistory:
      type: object
      description: Keyword ranking history entry
      properties:
        date:
          type: string
          format: date
        position:
          type: integer
          example: 5
        url:
          type: string
          format: uri
          nullable: true

    # Notification Schema
    Notification:
      type: object
      description: User notification
      required:
        - id
        - type
        - data
      properties:
        id:
          type: integer
          example: 123
          minimum: 1
        type:
          type: string
          example: "App\\Notifications\\KeywordPositionChanged"
        data:
          type: object
          properties:
            message:
              type: string
            keyword:
              type: string
            old_position:
              type: integer
            new_position:
              type: integer
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # Alert Settings Schema
    AlertSettings:
      type: object
      description: User alert preferences
      properties:
        email_enabled:
          type: boolean
          example: true
        slack_enabled:
          type: boolean
          example: false
        slack_webhook_url:
          type: string
          format: uri
          nullable: true
        notify_on_position_change:
          type: boolean
          example: true
        notify_on_audit_complete:
          type: boolean
          example: true
        position_change_threshold:
          type: integer
          example: 5

    # Content Decay Candidate Schema
    ContentDecayCandidate:
      type: object
      description: Content decay detection candidate
      required:
        - id
        - url
        - decay_score
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        url:
          type: string
          format: uri
          example: "https://example.com/article"
        title:
          type: string
          example: "How to do SEO"
        decay_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 75.5
        traffic_drop_percent:
          type: number
          format: float
          example: 45.2
        status:
          type: string
          enum: [new, reviewed, scheduled, refreshed]
          example: "new"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Business Location Schema (Local SEO)
    BusinessLocation:
      type: object
      description: Business location for local SEO
      required:
        - id
        - name
        - address
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        name:
          type: string
          example: "My Business Location"
        address:
          type: string
          example: "123 Main St, City, State 12345"
        phone:
          type: string
          nullable: true
          example: "+1-555-123-4567"
        gbp_connected:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Credit Transaction Schema
    CreditTransaction:
      type: object
      description: Credit purchase or usage transaction
      required:
        - id
        - amount
        - type
      properties:
        id:
          type: integer
          example: 1
          minimum: 1
        amount:
          type: integer
          example: 100
        type:
          type: string
          enum: [purchase, usage, refund, bonus]
          example: "purchase"
        description:
          type: string
          example: "Credit purchase - Basic Pack"
        balance_after:
          type: integer
          example: 500
        created_at:
          type: string
          format: date-time

paths:
  # ========================================================================
  # Public Endpoints
  # ========================================================================
  
  /health:
    get:
      tags:
        - Public
      summary: Health check
      description: Returns the health status of the API service
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: healthy
                timestamp: '2024-01-15T10:30:00Z'
                services:
                  database: connected
                  cache: connected
                  queue: running
        '500':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Service unavailable"
                status: 500

  /indicators:
    get:
      tags:
        - Public
      summary: Get indicators placeholder
      description: Returns placeholder data for indicators endpoint
      operationId: getIndicators
      responses:
        '200':
          description: Indicators data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Indicators endpoint"

  # ========================================================================
  # Authentication Endpoints
  # ========================================================================
  
  /v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      description: Creates a new user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "securepassword123"
                password_confirmation:
                  type: string
                  format: password
                  example: "securepassword123"
            example:
              name: "John Doe"
              email: "john@example.com"
              password: "securepassword123"
              password_confirmation: "securepassword123"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticates user and returns access token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "securepassword123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abc123def456..."
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Revokes the current access token
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/user:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Returns the authenticated user's profile
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset
      description: Sends a password reset link to the user's email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset link sent"

  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      description: Resets the user's password using the reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password has been reset successfully"
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/verify-email/{id}/{hash}:
    get:
      tags:
        - Auth
      summary: Verify email address
      description: Verifies the user's email address
      operationId: verifyEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email verified successfully"
        '403':
          description: Invalid verification link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Resend verification email
      description: Resends the email verification link
      operationId: resendVerification
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification email sent"
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/google:
    post:
      tags:
        - Auth
      summary: Google OAuth redirect
      description: Initiates Google OAuth flow
      operationId: googleAuthRedirect
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OAuth redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri

  /v1/auth/google/callback:
    post:
      tags:
        - Auth
      summary: Google OAuth callback
      description: Handles Google OAuth callback
      operationId: googleAuthCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:

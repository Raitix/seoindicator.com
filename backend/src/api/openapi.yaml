openapi: 3.0.3

info:
  title: SEOIndicator API
  version: 1.0.0
  description: |
    SEOIndicator API provides programmatic access to SEO tracking, analysis, and reporting features.
    
    ## Authentication
    Most endpoints require authentication via:
    - **Bearer Token**: JWT token from login/register (for web UI sessions)
    - **API Key**: X-API-Key header (for external API access)
    
    ## Rate Limiting
    API endpoints are rate-limited to ensure fair usage. Check the X-RateLimit headers in responses.
    
    ## Error Handling
    All errors follow a consistent format with `message` and optionally `errors` fields.
  contact:
    name: SEOIndicator Support
    email: support@seoindicator.com
    url: https://seoindicator.com/support
  license:
    name: Proprietary
    url: https://seoindicator.com/license
  termsOfService: https://seoindicator.com/terms

servers:
  - url: https://seoindicator.com/api
    description: Production server
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://staging.seoindicator.com/api
    description: Staging server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Keywords
    description: Keyword tracking and management
  - name: Sites
    description: Site management and dashboard
  - name: Projects
    description: Project management
  - name: Reports
    description: Report generation and management
  - name: Audits
    description: SEO audit management
  - name: Competitors
    description: Competitor tracking
  - name: Analysis
    description: Analysis jobs and results
  - name: AI Visibility
    description: AI visibility tracking projects
  - name: Local SEO
    description: Local SEO and GBP management
  - name: Public
    description: Public endpoints (no authentication required)
  - name: Admin
    description: Admin-only endpoints
  - name: Webhooks
    description: Webhook management
  - name: Credits
    description: Credit and payment management
  - name: Tools
    description: SEO tools and utilities
  - name: GSC
    description: Google Search Console integration

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication from login/register
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication for external access

  schemas:
    # ========================================
    # Common Schemas
    # ========================================
    Error:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Human-readable error message
          example: "Validation failed"
        status:
          type: integer
          description: HTTP status code
          example: 422
        errors:
          type: array
          description: Detailed validation errors
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "The email must be a valid email address."
    
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 7
        from:
          type: integer
          example: 1
        to:
          type: integer
          example: 15

    # ========================================
    # Auth Schemas
    # ========================================
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "secret123"

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "secret123"
        password_confirmation:
          type: string
          format: password
          example: "secret123"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              description: Bearer token for authentication
              example: "1|abcdef123456..."

    # ========================================
    # Site/Project Schemas
    # ========================================
    Site:
      type: object
      required:
        - id
        - url
        - name
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: "https://example.com"
        name:
          type: string
          example: "Example Site"
        user_id:
          type: integer
          example: 1
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      required:
        - id
        - name
        - user_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "SEO Project"
        user_id:
          type: integer
          example: 1
        description:
          type: string
          nullable: true
          example: "Main SEO tracking project"
        is_archived:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # Keyword Schemas
    # ========================================
    Keyword:
      type: object
      required:
        - id
        - keyword
        - site_id
      properties:
        id:
          type: integer
          example: 1
        keyword:
          type: string
          example: "seo tools"
        site_id:
          type: integer
          example: 1
        search_engine:
          type: string
          enum: [google, bing]
          example: "google"
        country:
          type: string
          example: "US"
        language:
          type: string
          example: "en"
        current_position:
          type: integer
          nullable: true
          example: 5
        previous_position:
          type: integer
          nullable: true
          example: 7
        search_volume:
          type: integer
          nullable: true
          example: 10000
        difficulty:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          example: 45
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KeywordRanking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        keyword_id:
          type: integer
          example: 1
        position:
          type: integer
          example: 5
        url:
          type: string
          format: uri
          example: "https://example.com/seo-tools"
        checked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # ========================================
    # Report Schemas
    # ========================================
    Report:
      type: object
      required:
        - id
        - site_id
        - type
        - status
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        type:
          type: string
          enum: [weekly, monthly, custom]
          example: "weekly"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "completed"
        format:
          type: string
          enum: [pdf, csv]
          example: "pdf"
        name:
          type: string
          nullable: true
          example: "Weekly SEO Report"
        file_path:
          type: string
          nullable: true
        generated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportGenerateRequest:
      type: object
      required:
        - site_id
        - type
        - format
      properties:
        site_id:
          type: integer
          example: 1
        type:
          type: string
          enum: [weekly, monthly, custom]
          example: "weekly"
        format:
          type: string
          enum: [pdf, csv]
          example: "pdf"
        name:
          type: string
          example: "Weekly SEO Report"

    # ========================================
    # Audit Schemas
    # ========================================
    Audit:
      type: object
      required:
        - id
        - site_id
        - status
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
          example: "completed"
        pages_crawled:
          type: integer
          example: 50
        issues_found:
          type: integer
          example: 12
        critical_issues:
          type: integer
          example: 2
        warning_issues:
          type: integer
          example: 5
        notice_issues:
          type: integer
          example: 5
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditIssue:
      type: object
      properties:
        id:
          type: integer
          example: 1
        audit_id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: "https://example.com/page"
        issue_type:
          type: string
          example: "missing_title"
        severity:
          type: string
          enum: [critical, warning, notice]
          example: "critical"
        message:
          type: string
          example: "Missing title tag"
        recommendation:
          type: string
          example: "Add a unique title tag to this page"
        status:
          type: string
          enum: [open, ignored, resolved]
          example: "open"
        created_at:
          type: string
          format: date-time

    # ========================================
    # Competitor Schemas
    # ========================================
    Competitor:
      type: object
      required:
        - id
        - domain
        - site_id
      properties:
        id:
          type: integer
          example: 1
        domain:
          type: string
          format: hostname
          example: "competitor.com"
        site_id:
          type: integer
          example: 1
        name:
          type: string
          nullable: true
          example: "Competitor Inc"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # Analysis Job Schemas
    # ========================================
    AnalysisJob:
      type: object
      required:
        - id
        - site_id
        - status
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
          example: "completed"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # AI Visibility Schemas
    # ========================================
    AIVisibilityProject:
      type: object
      required:
        - id
        - name
        - user_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Brand Visibility Tracking"
        user_id:
          type: integer
          example: 1
        brands:
          type: array
          items:
            type: string
          example: ["SEOIndicator", "CompetitorA"]
        platforms:
          type: array
          items:
            type: string
            enum: [chatgpt, perplexity, claude]
          example: ["chatgpt", "perplexity"]
        mention_rate:
          type: number
          format: float
          example: 0.45
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # Local SEO Schemas
    # ========================================
    BusinessLocation:
      type: object
      required:
        - id
        - site_id
        - name
        - address
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        gbp_place_id:
          type: string
          nullable: true
          example: "ChIJN1t_tDeuEmsRUsoyGKfrt4Q"
        name:
          type: string
          example: "Example Business"
        address:
          type: string
          example: "123 Main St, City, ST 12345"
        phone:
          type: string
          nullable: true
          example: "+1-555-123-4567"
        website:
          type: string
          format: uri
          nullable: true
          example: "https://example.com"
        category:
          type: string
          nullable: true
          example: "Restaurant"
        latitude:
          type: number
          format: double
          nullable: true
          example: 40.7128
        longitude:
          type: number
          format: double
          nullable: true
          example: -74.0060
        gbp_connected:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # Webhook Schemas
    # ========================================
    Webhook:
      type: object
      required:
        - id
        - url
        - events
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: "https://example.com/webhook"
        events:
          type: array
          items:
            type: string
          example: ["keyword.position_changed", "audit.completed"]
        secret:
          type: string
          description: Secret for HMAC signature verification
          example: "whsec_xxx"
        is_active:
          type: boolean
          example: true
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookCreateRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          example: "https://example.com/webhook"
        events:
          type: array
          minItems: 1
          items:
            type: string
          example: ["keyword.position_changed"]
        secret:
          type: string
          example: "my-webhook-secret"

    # ========================================
    # API Key Schemas
    # ========================================
    ApiKey:
      type: object
      required:
        - id
        - name
        - key
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Production API Key"
        key:
          type: string
          description: The API key (only shown once on creation)
          example: "sk_live_xxxxxxxxxxxx"
        permissions:
          type: array
          items:
            type: string
          example: ["keywords:read", "keywords:write"]
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ========================================
    # Notification Schemas
    # ========================================
    Notification:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        type:
          type: string
          example: "keyword_alert"
        notifiable_type:
          type: string
          example: "App\\Models\\User"
        notifiable_id:
          type: integer
          example: 1
        data:
          type: object
          properties:
            message:
              type: string
              example: "Keyword 'seo tools' moved from position 5 to 3"
            keyword_id:
              type: integer
              example: 1
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ========================================
    # Dashboard Stats Schemas
    # ========================================
    DashboardStats:
      type: object
      properties:
        total_keywords:
          type: integer
          example: 150
        avg_position:
          type: number
          format: float
          example: 12.5
        top_10_keywords:
          type: integer
          example: 45
        top_100_keywords:
          type: integer
          example: 120
        position_changes:
          type: object
          properties:
            improved:
              type: integer
              example: 12
            declined:
              type: integer
              example: 8
            unchanged:
              type: integer
              example: 130
        organic_traffic:
          type: object
          properties:
            current:
              type: integer
              example: 5000
            previous:
              type: integer
              example: 4500
            change:
              type: number
              format: float
              example: 11.1

    # ========================================
    # Health Check Schema
    # ========================================
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          example: "ok"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        database:
          type: string
          enum: [connected, disconnected]
          example: "connected"

paths:
  # ========================================
  # Health & Public Endpoints
  # ========================================
  /health:
    get:
      operationId: getHealth
      summary: Health check endpoint
      description: Returns the current health status of the API
      tags:
        - Public
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /indicators:
    get:
      operationId: getIndicators
      summary: Get available indicators
      description: Returns list of available SEO indicators
      tags:
        - Public
      responses:
        '200':
          description: List of indicators
          content:
            application/json:
              schema:
                type: object
                properties:
                  indicators:
                    type: array
                    items:
                      type: object

  # ========================================
  # Authentication Endpoints
  # ========================================
  /v1/auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: Creates a new user account and returns authentication token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/login:
    post:
      operationId: login
      summary: Login user
      description: Authenticates user and returns token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Logout user
      description: Invalidates the current authentication token
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"

  /v1/auth/user:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: Returns the authenticated user's profile
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset
      description: Sends a password reset link to the user's email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset link sent"

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password
      description: Resets the user's password using the token from email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - password_confirmation
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully"
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/verify-email/{id}/{hash}:
    get:
      operationId: verifyEmail
      summary: Verify email address
      description: Verifies the user's email address
      tags:
        - Auth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email verified successfully"
        '403':
          description: Invalid verification link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend verification email
      description: Resends the email verification link
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Verification email sent"

  /v1/auth/google:
    post:
      operationId: googleAuthRedirect
      summary: Google OAuth redirect
      description: Initiates Google OAuth authentication flow
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':

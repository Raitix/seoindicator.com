openapi: 3.0.3

info:
  title: SEOIndicator API
  version: 1.0.0
  description: |
    SEOIndicator API provides comprehensive SEO tracking, analysis, and reporting capabilities.
    
    ## Authentication
    Most endpoints require authentication using either:
    - **Bearer Token**: JWT token obtained from login
    - **API Key**: X-API-Key header for external API access
    
    ## Rate Limiting
    API endpoints are rate-limited. Check the `X-RateLimit-Limit` and `X-RateLimit-Remaining` headers.
    
    ## Pagination
    List endpoints support pagination via `page` and `per_page` query parameters.
  contact:
    name: SEOIndicator Support
    email: support@seoindicator.com
    url: https://seoindicator.com/contact
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://seoindicator.com/terms

servers:
  - url: https://api.seoindicator.com
    description: Production server
  - url: https://staging-api.seoindicator.com
    description: Staging server
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Auth
    description: Authentication and authorization endpoints
  - name: Keywords
    description: Keyword tracking and management
  - name: Sites
    description: Site management and configuration
  - name: Projects
    description: Project organization and management
  - name: Reports
    description: Report generation and scheduling
  - name: Audits
    description: SEO audit management
  - name: Competitors
    description: Competitor tracking and analysis
  - name: Analysis
    description: Analysis job management
  - name: AI Visibility
    description: AI visibility tracking and analytics
  - name: Public
    description: Public endpoints without authentication
  - name: Admin
    description: Administrative endpoints
  - name: Payments
    description: Payment and credit management
  - name: Webhooks
    description: Webhook configuration and management
  - name: GSC
    description: Google Search Console integration
  - name: SERP Features
    description: SERP feature tracking
  - name: Suggestions
    description: Keyword suggestions
  - name: Notifications
    description: Notification management
  - name: Local SEO
    description: Local SEO and GBP management
  - name: Content Decay
    description: Content decay detection and refresh planning
  - name: Models
    description: AI model listing and pricing
  - name: Tools
    description: SEO tools and utilities
  - name: PWA
    description: Progressive Web App endpoints
  - name: Credits
    description: Credit system management
  - name: Backlinks
    description: Backlink tracking and analysis
  - name: Annotations
    description: Keyword annotations
  - name: Onboarding
    description: User onboarding flow
  - name: Dashboard
    description: User dashboard data
  - name: API Keys
    description: API key management
  - name: Alerts
    description: Alert configuration and management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication obtained from login endpoint
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication for external API access

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Human-readable error message
        status:
          type: integer
          description: HTTP status code
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      example:
        message: Validation failed
        status: 422
        errors:
          - field: email
            message: The email field is required.

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 7
        from:
          type: integer
          example: 1
        to:
          type: integer
          example: 15

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully
        success:
          type: boolean
          example: true

    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          type: string
          enum: [user, admin]
          default: user

    UserStoreRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: "SecureP@ss123"
        password_confirmation:
          type: string
          format: password
          example: "SecureP@ss123"

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [user, admin]

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: "SecureP@ss123"
        remember:
          type: boolean
          default: false

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT authentication token

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "SecureP@ss123"
        password_confirmation:
          type: string
          format: password
          example: "SecureP@ss123"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - email
        - password
        - password_confirmation
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    Site:
      type: object
      required:
        - id
        - url
        - name
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: https://example.com
        name:
          type: string
          example: Example Site
        user_id:
          type: integer
          example: 1
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SiteStoreRequest:
      type: object
      required:
        - url
        - name
      properties:
        url:
          type: string
          format: uri
          example: https://example.com
        name:
          type: string
          example: Example Site
        is_active:
          type: boolean
          default: true

    SiteUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
        is_active:
          type: boolean

    SiteDashboard:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/Site'
        keywords_count:
          type: integer
        average_position:
          type: number
          format: float
        visibility_score:
          type: number
          format: float
        top_keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'

    Keyword:
      type: object
      required:
        - id
        - keyword
        - site_id
      properties:
        id:
          type: integer
          example: 1
        keyword:
          type: string
          example: "seo tools"
        site_id:
          type: integer
          example: 1
        current_position:
          type: integer
          nullable: true
          example: 5
        previous_position:
          type: integer
          nullable: true
          example: 7
        search_volume:
          type: integer
          nullable: true
          example: 10000
        difficulty:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          example: 65
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KeywordStoreRequest:
      type: object
      required:
        - keyword
      properties:
        keyword:
          type: string
          example: "seo tools"
        search_volume:
          type: integer
        difficulty:
          type: integer
          minimum: 0
          maximum: 100

    KeywordUpdateRequest:
      type: object
      properties:
        keyword:
          type: string
        search_volume:
          type: integer
        difficulty:
          type: integer
          minimum: 0
          maximum: 100
        is_active:
          type: boolean

    KeywordRanking:
      type: object
      properties:
        id:
          type: integer
        keyword_id:
          type: integer
        position:
          type: integer
        checked_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri

    KeywordHistory:
      type: object
      properties:
        keyword:
          $ref: '#/components/schemas/Keyword'
        rankings:
          type: array
          items:
            $ref: '#/components/schemas/KeywordRanking'

    Project:
      type: object
      required:
        - id
        - name
        - user_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "My SEO Project"
        description:
          type: string
          nullable: true
        user_id:
          type: integer
          example: 1
        is_archived:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectStoreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "My SEO Project"
        description:
          type: string

    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Report:
      type: object
      required:
        - id
        - site_id
        - type
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        type:
          type: string
          enum: [weekly, monthly, custom]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        file_path:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReportGenerateRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [weekly, monthly, custom]
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        format:
          type: string
          enum: [pdf, csv, json]
          default: pdf

    ReportTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        site_id:
          type: integer
        sections:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ScheduledReport:
      type: object
      properties:
        id:
          type: integer
        site_id:
          type: integer
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        day_of_week:
          type: integer
          nullable: true
        day_of_month:
          type: integer
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Audit:
      type: object
      required:
        - id
        - site_id
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        status:
          type: string
          enum: [pending, running, completed, failed]
        score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        issues_count:
          type: integer
          default: 0
        critical_issues:
          type: integer
          default: 0
        warnings:
          type: integer
          default: 0
        is_public:
          type: boolean
          default: false
        public_hash:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditStoreRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        check_pages:
          type: array
          items:
            type: string

    AuditIssue:
      type: object
      properties:
        id:
          type: integer
        audit_id:
          type: integer
        type:
          type: string
        severity:
          type: string
          enum: [critical, warning, notice]
        message:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [open, ignored, fixed]
        created_at:
          type: string
          format: date-time

    Competitor:
      type: object
      required:
        - id
        - url
        - site_id
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: https://competitor.com
        site_id:
          type: integer
          example: 1
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompetitorStoreRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: https://competitor.com
        name:
          type: string

    CompetitorUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        name:
          type: string

    AnalysisJob:
      type: object
      required:
        - id
        - site_id
        - type
      properties:
        id:
          type: integer
          example: 1
        site_id:
          type: integer
          example: 1
        type:
          type: string
          enum: [full, quick, custom]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnalysisJobStoreRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [full, quick, custom]
        pages:
          type: array
          items:
            type: string

    AnalysisJobProgress:
      type: object
      properties:
        job_id:
          type: integer
        status:
          type: string
        progress:
          type: integer
        current_task:
          type: string
        estimated_time_remaining:
          type: integer
          description: Estimated seconds remaining

    AIVisibilityProject:
      type: object
      required:
        - id
        - name
        - site_id
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "AI Visibility Project"
        site_id:
          type: integer
          example: 1
        queries:
          type: array
          items:
            type: string
        is_active:
          type: boolean
          default: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AIVisibilityProjectStoreRequest:
      type: object
      required:
        - name
        - queries
      properties:
        name:
          type: string
          example: "AI Visibility Project"
        queries:
          type: array
          items:
            type: string
          example: ["What is SEO?", "Best SEO tools"]
        site_id:
          type: integer

    AIVisibilityAnalytics:
      type: object
      properties:
        project_id:
          type: integer
        total_mentions:
          type: integer
        average_position:
          type: number
          format: float
        visibility_score:
          type: number
          format: float
        trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              mentions:
                type: integer
              position:
                type: number

    Webhook:
      type: object
      required:
        - id
        - url
        - events
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: https://example.com/webhook
        events:
          type: array
          items:
            type: string
          example: ["keyword.position_changed", "report.generated"]
        is_active:
          type: boolean
          default: true
        secret:
          type: string
          description: Secret for signature verification
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookStoreRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          example: https://example.com/webhook
        events:
          type: array
          items:
            type: string
          example: ["keyword.position_changed", "report.generated"]
        secret:
          type: string

    WebhookUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        notifiable_type:
          type: string
        notifiable_id:
          type: integer
        data:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ApiKey:
      type: object
      required:
        - id
        - name
        - key
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Production API Key"
        key:
          type: string
          description: The API key (only shown once on creation)
        permissions:
          type: array
          items:
            type: string
          example: ["keywords:read", "keywords:write"]
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ApiKeyStoreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Production API Key"
        permissions:
          type: array
          items:
            type: string
          example: ["keywords:read", "keywords:write"]
        expires_at:
          type: string
          format: date-time

    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        amount:
          type: integer
          description: Credit amount (positive for purchases, negative for usage)
        balance_after:
          type: integer
        description:
          type: string
        type:
          type: string
          enum: [purchase, usage, refund, bonus]
        created_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [card, paypal]
        last4:
          type: string
        brand:
          type: string
        expiry_month:
          type: integer
        expiry_year:
          type: integer
        is_default:
          type: boolean

    PayPalOrderRequest:
      type: object
      required:
        - credits
      properties:
        credits:
          type: integer
          example: 100
        return_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri

    AIModel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          type: string
        type:
          type: string
          enum: [chat, completion, embedding]
        context_window:
          type: integer
        max_tokens:
          type: integer
        input_cost_per_1k:
          type: number
          format: float
        output_cost_per_1k:
          type: number
          format: float
        is_active:
          type: boolean

    ModelPricing:
      type: object
      properties:
        model_id:
          type: integer
        model_name:
          type: string
        input_cost_per_1k:
          type: number
          format: float
        output_cost_per_1k:
          type: number
          format: float
        currency:
          type: string
          default: USD

    SERPFeature:
      type: object
      properties:
        id:
          type: integer
        keyword_id:
          type: integer
        feature_type:
          type: string
          enum: [featured_snippet, local_pack, knowledge_panel, image_pack, video, people_also_ask, related_searches, sitelinks]
        position:
          type: integer
        is_owned:
          type: boolean
          description: Whether the site owns this feature
        detected_at:
          type: string
          format: date-time

    KeywordSuggestion:
      type: object
      properties:
        id:
          type: integer
        keyword:
          type: string
        search_volume:
          type: integer
        difficulty:
          type: integer
        cpc:
          type: number
          format: float
        competition:
          type: number
          format: float
        source:
          type: string
        status:
          type: string
          enum: [new, tracked, dismissed]
        created_at:
          type: string
          format: date-time

    Annotation:
      type: object
      required:
        - id
        - keyword_id
        - content
      properties:
        id:
          type: integer
          example: 1
        keyword_id:
          type: integer
          example: 1
        content:
          type: string
          example: "Algorithm update detected"
        type:
          type: string
          enum: [note, event, milestone]
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnnotationStoreRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        type:
          type: string
          enum: [note, event, milestone]
        date:
          type: string
          format: date

    OnboardingStep:
      type: object
      properties:
        step:
          type: string
        is_completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true

    OnboardingData:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
        current_step:
          type: string
        is_completed:
          type: boolean

    AlertSettings:
      type: object
      properties:
        email_enabled:
          type: boolean
        push_enabled:
          type: boolean
        keyword_position_change:
          type: boolean
        weekly_report:
          type: boolean
        audit_complete:
          type: boolean
        threshold:
          type: integer
          description: Position change threshold for alerts

    Backlink:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        source_url:
          type: string
          format: uri
        target_url:
          type: string
          format: uri
        anchor_text:
          type: string
        domain_authority:
          type: integer
        page_authority:
          type: integer
        is_nofollow:
          type: boolean
        is_active:
          type: boolean
        first_seen_at:
          type: string
          format: date-time
        last_checked_at:
          type: string
          format: date-time

    BusinessLocation:
      type: object
      properties:
        id:
          type: integer
        site_id:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        region:
          type: string
        postal_code:
          type: string
        country:
          type: string
        phone:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        gbp_connected:
          type: boolean
        gbp_location_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    GBPInsights:
      type: object
      properties:
        location_id:
          type: integer
        views_search:
          type: integer
        views_maps:
          type: integer
        actions_website:
          type: integer
        actions_phone:
          type: integer
        actions_directions:
          type: integer
        photos_count:
          type: integer
        reviews_count:
          type: integer
        average_rating:
          type: number
          format: float

    GBPReview:
      type: object
      properties:
        id:
          type: string
        location_id:
          type: integer
        author_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
        created_at:
          type: string
          format: date-time
        reply:
          type: string
          nullable: true
        replied_at:
          type: string
          format: date-time
          nullable: true

    ContentDecayCandidate:
      type: object
      properties:
        id:
          type: integer
        site_id:
          type: integer
        url:
          type: string
          format: uri
        title:
          type: string
        traffic_drop_percentage:
          type: number
          format: float
        position_drop:
          type: integer
        last_analyzed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [new, reviewing, refresh_planned, refreshed, ignored]
        priority:
          type: string
          enum: [high, medium, low]

    ContentRefreshTask:
      type: object
      properties:
        id:
          type: integer
        candidate_id:
          type: integer
        type:
          type: string
          enum: [update_content, add_internal_links, optimize_meta, refresh_images]
        status:
          type: string
          enum: [pending, in_progress, completed]
        assigned_to:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
          nullable: true

    ToolExportRequest:
      type: object
      required:
        - tool
        - format
      properties:
        tool:
          type: string
          enum: [serp_analyzer, keyword_research, backlink_checker, page_analyzer]
        format:
          type: string
          enum: [pdf, csv, json]
        data:
          type: object

    PublicAudit:
      type: object
      properties:
        hash:
          type: string
        audit:
          $ref: '#/components/schemas/Audit'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/AuditIssue'
        is_public:
          type: boolean

    LeadCapture:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        company:
          type: string
        phone:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]
            cache:
              type: string
              enum: [connected, disconnected]
            queue:
              type: string
              enum: [running, stopped]

    AdminStats:
      type: object
      properties:
        users_count:
          type: integer
        sites_count:
          type: integer
        keywords_count:
          type: integer
        audits_count:
          type: integer
        reports_count:
          type: integer
        active_users_today:
          type: integer
        revenue_this_month:
          type: number
          format: float

    AdminHealthOverview:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: integer
        database:
          type: object
        queues:
          type: object
        memory_usage:
          type: number
        cpu_usage:
          type: number

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      description: Returns the current health status of the API
      tags:
        - Public
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /indicators:
    get:
      operationId: getIndicators
      summary: Get SEO indicators
      description: Returns placeholder SEO indicators data
      tags:
        - Public
      responses:
        '200':
          description: Indicators data
          content:
            application/json:
              schema:
                type: object

  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      description: Creates a new user account and returns authentication token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate user
      description: Authenticates user and returns JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Logout user
      description: Invalidates the current authentication token
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/auth/user:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: Returns the authenticated user's profile
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset
      description: Sends a password reset link to the user's email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password
      description: Resets the user's password using the reset token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/verify-email/{id}/{hash}:
    get:
      operationId: verifyEmail
      summary: Verify email address
      description: Verifies the user's email address using the verification link
      tags:
        - Auth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Invalid verification link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend verification email
      description: Resends the email verification link
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/auth/google:
    post:
      operationId: googleAuthRedirect
      summary: Initiate Google OAuth
      description: Initiates Google OAuth authentication flow
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OAuth redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri

  /v1/auth/google/callback:
    post:
      operationId: googleAuthCallback
      summary: Handle Google OAuth callback
      description: Handles the callback from Google OAuth
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/keywords:
    get:
      operationId: listKeywords
      summary: List keywords
      description: Returns a paginated list of keywords for external API access
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: site_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of keywords
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Keyword'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createKeyword
      summary: Create keyword
      description: Creates a new keyword for tracking
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordStoreRequest'
      responses:
        '201':
          description: Keyword created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/keywords/{id}:
    get:
      operationId: getKeyword
      summary: Get keyword details
      description: Returns details for a specific keyword
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Keyword details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        '404':
          description: Keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateKeyword
      summary: Update keyword
      description: Updates a keyword's details
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeywordUpdateRequest'
      responses:
        '200':
          description: Keyword updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
        '404':
          description: Keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteKeyword
      summary: Delete keyword
      description: Deletes a keyword from tracking
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Keyword deleted
        '404':
          description: Keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


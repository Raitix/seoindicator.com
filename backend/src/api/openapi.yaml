openapi: '3.0.3'

info:
  title: SEOIndicator API
  version: '1.0.0'
  description: |
    SEOIndicator is a comprehensive SEO analysis and monitoring platform.
    
    This API provides programmatic access to:
    - Keyword ranking tracking and history
    - Site management and dashboards
    - SEO audits and technical issue detection
    - AI visibility tracking and analytics
    - Local SEO and Google Business Profile management
    - Report generation and scheduling
    - Competitor analysis
    
    ## Authentication
    Most endpoints require authentication via:
    - **Bearer Token**: Laravel Sanctum session token (for web UI)
    - **API Key**: X-API-Key header (for external API access)
    
    ## Rate Limiting
    - Standard endpoints: 60 requests per minute
    - Authentication endpoints: 5 requests per minute
    - Analysis endpoints: Various limits apply
    
  contact:
    name: SEOIndicator Support
    email: support@seoindicator.com
    url: https://seoindicator.com/support
  license:
    name: Proprietary
    url: https://seoindicator.com/terms
  termsOfService: https://seoindicator.com/terms

servers:
  - url: https://seoindicator.com/api
    description: Production server
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://staging.seoindicator.com/api
    description: Staging server

tags:
  - name: Auth
    description: User authentication and session management
  - name: Keywords
    description: Keyword tracking and ranking management
  - name: Sites
    description: Site management and configuration
  - name: Projects
    description: Project organization and management
  - name: Reports
    description: Report generation and scheduling
  - name: Audits
    description: Technical SEO site audits
  - name: Analysis
    description: On-demand SEO analysis jobs
  - name: Competitors
    description: Competitor tracking and comparison
  - name: AI Visibility
    description: AI platform visibility tracking
  - name: Local SEO
    description: Local SEO and Google Business Profile
  - name: Admin
    description: Administrative endpoints
  - name: Public
    description: Public endpoints without authentication
  - name: Webhooks
    description: Webhook management
  - name: Payments
    description: Payment and credit management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Laravel Sanctum token authentication
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for external programmatic access

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Site:
      type: object
      required:
        - id
        - url
        - name
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          format: uri
          example: https://example.com
        name:
          type: string
          example: Example Site
        user_id:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    Keyword:
      type: object
      required:
        - id
        - keyword
        - site_id
      properties:
        id:
          type: integer
        keyword:
          type: string
        site_id:
          type: integer
        search_engine:
          type: string
        country:
          type: string
        current_position:
          type: integer
          nullable: true
        previous_position:
          type: integer
          nullable: true
    Project:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        is_archived:
          type: boolean
    Report:
      type: object
      required:
        - id
        - site_id
      properties:
        id:
          type: integer
        site_id:
          type: integer
        type:
          type: string
        format:
          type: string
        status:
          type: string
    Audit:
      type: object
      required:
        - id
        - site_id
      properties:
        id:
          type: integer
        site_id:
          type: integer
        status:
          type: string
        pages_crawled:
          type: integer
        issues_found:
          type: integer
    BusinessLocation:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
          nullable: true
        gbp_connected:
          type: boolean
    AIVisibilityProject:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        brand_name:
          type: string
        mention_rate:
          type: number
    Competitor:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        domain:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        status:
          type: integer
        errors:
          type: array
          items:
            type: object
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

security: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check endpoint
      description: Returns the health status of the API
      tags:
        - Public
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /indicators:
    get:
      operationId: getIndicators
      summary: Get indicator definitions
      description: Returns list of available SEO indicators
      tags:
        - Public
      responses:
        '200':
          description: List of indicators
          content:
            application/json:
              schema:
                type: object

  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Logout user
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object

  /v1/auth/user:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
              properties:
                token:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Password reset

  /v1/auth/verify-email/{id}/{hash}:
    get:
      operationId: verifyEmail
      summary: Verify email address
      tags:
        - Auth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified

  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend verification email
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification email sent

  /v1/auth/google:
    post:
      operationId: googleAuthRedirect
      summary: Initiate Google OAuth
      tags:
        - Auth
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object

  /v1/auth/google/callback:
    post:
      operationId: googleAuthCallback
      summary: Handle Google OAuth callback
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Authentication successful

  /v1/keywords:
    get:
      operationId: listKeywords
      summary: List keywords
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: site_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Keywords list
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: createKeyword
      summary: Create keyword
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyword
                - site_id
              properties:
                keyword:
                  type: string
                site_id:
                  type: integer
      responses:
        '201':
          description: Keyword created

  /v1/keywords/{id}:
    get:
      operationId: getKeyword
      summary: Get keyword details
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Keyword details
    put:
      operationId: updateKeyword
      summary: Update keyword
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Keyword updated
    delete:
      operationId: deleteKeyword
      summary: Delete keyword
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Keyword deleted

  /v1/keywords/{id}/rankings:
    get:
      operationId: getKeywordRankings
      summary: Get keyword rankings history
      tags:
        - Keywords
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rankings history

  /v1/keywords/{id}/history:
    get:
      operationId: getKeywordHistory
      summary: Get keyword ranking history
      tags:
        - Keywords
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ranking history

  /v1/keywords/{id}/check:
    post:
      operationId: checkKeywordRanking
      summary: Trigger ranking check
      tags:
        - Keywords
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          description: Ranking check initiated

  /v1/sites/{siteId}/keywords:
    get:
      operationId: getSiteKeywords
      summary: Get keywords for a site
      tags:
        - Keywords
      security:
        - BearerAuth: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Site keywords
    post:
      operationId: createSiteKeyword
      summary: Create keyword for site
      tags:
        - Keywords
      security:
        - BearerAuth: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyword
              properties:
                keyword:
                  type: string
      responses:
        '201':
          description: Keyword created

  /v1/sites:
    get:
      operationId: listSites
      summary: List sites
      tags:
        - Sites
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Sites list

  /v1/sites/{siteId}/dashboard:
    get:
      operationId: getSiteDashboard
      summary: Get site dashboard data
      tags:
        - Sites
      security:
        - BearerAuth: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dashboard data

  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
        - Projects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Projects list
    post:
      operationId: createProject
      summary: Create project
      tags:
        - Projects
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Project created

  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get project details
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Project details
    put:
      operationId: updateProject
      summary: Update project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Project updated
    delete:
      operationId: deleteProject
      summary: Delete project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Project deleted

  /v1/projects/{id}/archive:
    post:
      operationId: archiveProject
      summary: Archive project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Project archived

  /v1/projects/{id}/restore:
    post:
      operationId: restoreProject
      summary: Restore archived project
      tags:
        - Projects
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Project restored

  /v1/reports:
    post:
      operationId: generateReport
      summary: Generate report
      tags:
        - Reports
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - site_id
                - type
              properties:
                site_id:
                  type: integer
                type:
                  type: string
                format:
                  type: string
      responses:
        '202':
          description: Report generation queued

  /v1/sites/{siteId}/reports:
    get:
      operationId: listSiteReports
      summary: List reports for site
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reports list

  /v1/sites/{siteId}/reports/generate:
    post:
      operationId: generateSiteReport
      summary: Generate report for site
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Report generation started

  /v1/reports/{reportId}:
    get:
      operationId: getReport
      summary: Get report details
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Report details
    delete:
      operationId: deleteReport
      summary: Delete report
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Report deleted

  /v1/reports/{reportId}/download:
    get:
      operationId: downloadReport
      summary: Download report file
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Report file

  /v1/sites/{site}/audits:
    get:
      operationId: listAudits
      summary: List audits for site
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: site
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audits list
    post:
      operationId: createAudit
      summary: Create audit
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: site
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Audit created

  /v1/audits/{audit}:
    get:
      operationId: getAudit
      summary: Get audit details
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: audit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit details
    delete:
      operationId: deleteAudit
      summary: Delete audit
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: audit
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Audit deleted

  /v1/audits/{auditId}/issues:
    get:
      operationId: listAuditIssues
      summary: List audit issues
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: auditId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit issues

  /v1/audits/{auditId}/issues/bulk:
    patch:
      operationId: bulkUpdateIssues
      summary: Bulk update issues
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: auditId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Issues updated

  /v1/audits/{id}/publish:
    post:
      operationId: publishAudit
      summary: Publish audit
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit published

  /v1/audits/{id}/unpublish:
    delete:
      operationId: unpublishAudit
      summary: Unpublish audit
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit unpublished

  /v1/audits/{id}/embed-code:
    get:
      operationId: getEmbedCode
      summary: Get embed code
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Embed code

  /v1/audits/{id}/analytics:
    get:
      operationId: getAuditAnalytics
      summary: Get audit analytics
      tags:
        - Audits
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Audit analytics

  /v1/public-audit/{hash}:
    get:
      operationId: getPublicAudit
      summary: Get public audit
      tags:
        - Public
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public audit data

  /v1/public-audit/{hash}/lead:
    post:
      operationId: captureLead
      summary: Capture lead
      tags:
        - Public
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Lead captured

  /v1/public-audit/{hash}/badge:
    get:
      operationId: getBadgeConfig
      summary: Get badge configuration
      tags:
        - Public
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Badge configuration


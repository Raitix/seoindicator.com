            type: integer
          description: Filter by site ID
        - name: search
          in: query
          schema:
            type: string
          description: Search in keyword text
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: List of keywords
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Keyword'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 1
                    keyword: "seo tools"
                    site_id: 1
                    current_position: 5
                    is_active: true
                meta:
                  current_page: 1
                  per_page: 15
                  total: 100
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createKeyword
      summary: Create keyword
      description: Creates a new keyword to track
      tags:
        - Keywords
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyword
                - site_id
              properties:
                keyword:
                  type: string
                  example: "seo tools"
                site_id:
                  type: integer
                  example: 1
                search_engine:
                  type: string
                  enum: [google, bing]
                  default: google
                country:
                  type: string
                  example: "US"
                language:
                  type: string
                  example: "en"
            example:
              keyword: "seo tools"
              site_id: 1
              search_engine: "google"
              country: "US"
              language: "en"
      responses:
        '201':
          description: Keyword created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyword'
              example:
                id: 1
                keyword: "seo tools"
                site_id: 1
                search_engine: "google"
                country: "US"
                language: "en"
                current_position: null
                is_active: true
        '422':

  # ========================================
  # Onboarding Endpoints
  # ========================================
  /v1/onboarding:
    get:
      operationId: getOnboardingStatus
      summary: Get onboarding status
      description: Returns user's onboarding progress
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding status
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        is_completed:
                          type: boolean
    post:
      operationId: updateOnboarding
      summary: Update onboarding progress
      description: Updates onboarding step completion
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - step
              properties:
                step:
                  type: string
                completed:
                  type: boolean
      responses:
        '200':
          description: Onboarding updated

  /v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      summary: Complete onboarding
      description: Marks onboarding as complete
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding completed

  /v1/onboarding/skip:
    post:
      operationId: skipOnboarding
      summary: Skip onboarding
      description: Skips the onboarding process
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding skipped
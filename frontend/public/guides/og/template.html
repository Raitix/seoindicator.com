<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 100%;
    }
    .brand {
      font-size: 18px;
      color: #10b981;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
      font-weight: 600;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.3));
    }
    h1 {
      font-size: 56px;
      color: white;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }
    .subtitle {
      font-size: 24px;
      color: #94a3b8;
      max-width: 800px;
      line-height: 1.4;
    }
    .category-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }
    .category-on-page { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .category-technical { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .category-content { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">SEOIndicator</div>
    <div class="icon" id="icon">📝</div>
    <div class="category-badge" id="category">ON-PAGE SEO</div>
    <h1 id="title">Meta Title Optimization</h1>
    <p class="subtitle" id="subtitle">Learn how to craft compelling page titles that improve click-through rates and search rankings.</p>
  </div>
  <div class="footer">seoindicator.com/guides</div>
</body>
</html>

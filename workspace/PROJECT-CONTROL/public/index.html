<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Control Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🎛️ Workflow Control Center</h1>
    <div class="header-info">
      <span id="project-name">PROJECT-SEOINDICATOR</span>
      <span id="refresh-btn" onclick="refreshAll()" title="Refresh">🔄</span>
    </div>
  </header>

  <!-- Main Tabs -->
  <div class="main-tabs">
    <button class="main-tab active" data-tab="board" onclick="switchMainTab('board')">📋 Board</button>
    <button class="main-tab" data-tab="logs" onclick="switchMainTab('logs')">📜 Logs <span id="log-count" class="log-badge"></span></button>
  </div>

  <main>
    <!-- Board Tab -->
    <div id="tab-board" class="main-content active">
      <div id="agents-bar">
        <h3>Active Agents</h3>
        <div id="agents-list">
          <span class="agents-empty">No active agents</span>
        </div>
      </div>
      <div id="kanban-container">
        <div id="kanban-board"></div>
      </div>
    </div>

    <!-- Logs Tab -->
    <div id="tab-logs" class="main-content">
      <div class="logs-header">
        <h3>Orchestrator Logs</h3>
        <div class="logs-controls">
          <label>Show: 
            <select id="log-lines" onchange="loadLogs()">
              <option value="50">50 lines</option>
              <option value="100" selected>100 lines</option>
              <option value="200">200 lines</option>
              <option value="500">500 lines</option>
            </select>
          </label>
          <button onclick="loadLogs()" class="refresh-btn">🔄 Refresh</button>
          <label><input type="checkbox" id="auto-scroll" checked> Auto-scroll</label>
        </div>
      </div>
      <div id="logs-container">
        <div id="logs-content">Loading...</div>
      </div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-type" class="type-badge"></span>
        <h2 id="modal-title"></h2>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-meta">
        <div class="meta-item">
          <span class="meta-label">Status:</span>
          <span id="modal-status" class="status-badge"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Priority:</span>
          <span id="modal-priority" class="priority-badge"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Risk:</span>
          <span id="modal-risk" class="risk-badge"></span>
        </div>
      </div>
      <div class="modal-body">
        <div class="tabs">
          <button class="tab-btn active" data-tab="details" onclick="switchTab('details')">Details</button>
          <button class="tab-btn" data-tab="history" onclick="switchTab('history')">History</button>
        </div>
        <div id="tab-details" class="tab-content active">
          <div id="modal-content"></div>
        </div>
        <div id="tab-history" class="tab-content">
          <div id="history-timeline"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

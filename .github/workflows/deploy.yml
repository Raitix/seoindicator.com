name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '23'
  PHP_VERSION: '8.2'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable man-db triggers for faster apt operations
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chrome-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-chrome-
            playwright-browsers-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --max-failures=1 --workers=2 --pass-with-no-tests
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-out/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            
            DEPLOY_PATH="${{ secrets.SSH_DEPLOY_PATH }}"
            PAT="${{ secrets.GH_PAT }}"
            
            echo "=== Deploying to $DEPLOY_PATH ==="
            cd "$DEPLOY_PATH"
            
            # Configure git with PAT
            git remote set-url origin "https://${PAT}@github.com/Raitix/seoindicator.com.git"
            
            # Pull latest changes
            echo "=== Pulling latest changes ==="
            git fetch origin
            git reset --hard origin/main
            
            # Install backend dependencies
            echo "=== Installing backend dependencies ==="
            cd backend
            
            # Update lock file if out of sync
            composer update --lock --no-interaction 2>/dev/null || true
            
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            
            # Create/update .env with production credentials
            echo "=== Setting up .env ==="
            cat > .env << 'ENVEOF'
            APP_NAME=SEOIndicator
            APP_ENV=production
            APP_KEY=${{ secrets.LARAVEL_APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://seoindicator.com
            
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            
            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=error
            
            DB_CONNECTION=mysql
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            
            SESSION_DRIVER=file
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=file
            
            MAIL_MAILER=log
            MAIL_FROM_ADDRESS="hello@seoindicator.com"
            MAIL_FROM_NAME="${APP_NAME}"
            ENVEOF
            
            # Set permissions
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            
            # Clear cache to pick up new .env
            php artisan config:clear 2>/dev/null || true
            php artisan cache:clear 2>/dev/null || true
            
            # Run migrations
            echo "=== Running migrations ==="
            php artisan migrate --force
            
            # Cache config and routes for performance
            php artisan config:cache 2>/dev/null || true
            php artisan route:cache 2>/dev/null || true
            
            echo "=== Backend deployed ==="

      - name: Upload frontend via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "frontend-out/*"
          target: "${{ secrets.SSH_DEPLOY_PATH }}"
          strip_components: 1
          overwrite: true

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            DEPLOY_PATH="${{ secrets.SSH_DEPLOY_PATH }}"
            
            # Set permissions
            chmod -R 755 "$DEPLOY_PATH/backend/storage" 2>/dev/null || true
            chmod -R 755 "$DEPLOY_PATH/backend/bootstrap/cache" 2>/dev/null || true
            
            echo "=== Deployment complete ==="
            echo "URL: https://seoindicator.com"

  notify:
    needs: [build-and-test, deploy]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployed successfully to https://seoindicator.com"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

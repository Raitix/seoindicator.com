name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '23'
  PHP_VERSION: '8.2'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, mysql, pdo, pdo_mysql
          coverage: none

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build frontend (static export)
        working-directory: frontend
        run: |
          npm run build
          npm run export
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        continue-on-error: true # TODO: Remove when tests are stable

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, mysql, pdo, pdo_mysql

      - name: Install backend dependencies (production)
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare backend for production
        working-directory: backend
        run: |
          php artisan config:cache || true
          php artisan route:cache || true
        env:
          APP_ENV: production

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/out/
          server-dir: public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*

      - name: Deploy backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: public_html/api/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/tests/**
            **/.github/**
            **/storage/logs/**
            vendor/bin/**
            vendor/phpunit/**

      - name: Create production .env
        run: |
          cat > backend/.env.production << EOF
          APP_NAME=SEOIndicator
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=https://seoindicator.com
          
          DB_HOST=${{ secrets.DB_HOST }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DEPLOY_KEY=${{ secrets.DEPLOY_KEY }}
          EOF

      - name: Upload production .env
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/api/
          exclude: |
            **/*
            !.env.production

      - name: Run database migrations
        run: |
          curl -X POST "https://seoindicator.com/api/deploy/migrate" \
            -H "Content-Type: application/json" \
            -d '{"key": "${{ secrets.DEPLOY_KEY }}"}' \
            -s -w "\nHTTP Status: %{http_code}\n"

      - name: Health check
        run: |
          echo "Checking production health..."
          response=$(curl -s https://seoindicator.com/api/health)
          echo "$response"
          
          if echo "$response" | grep -q '"status":"ok"'; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi

  notify:
    needs: [build-and-test, deploy]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=✅ Deployed successfully" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-and-test.result }}" == "failure" ]; then
            echo "status=❌ Build/test failed" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Deploy failed or skipped" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: echo "${{ steps.status.outputs.status }}"

name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '23'
  PHP_VERSION: '8.2'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, mysql, pdo, pdo_mysql
          coverage: none

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        continue-on-error: true # TODO: Remove when tests are stable

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/
          retention-days: 1

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/out/

      # Deploy frontend (static files)
      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/out/
          server-dir: public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            api/**

      # Note: Backend deployment disabled for now
      # Laravel's vendor/ directory (6000+ files) causes FTP timeout
      # TODO: Implement one of these solutions:
      # 1. Upload vendor as ZIP and extract via SSH (requires SSH access)
      # 2. Use rsync over SSH instead of FTP
      # 3. Pre-upload vendor manually once, then sync only app files
      # 4. Use simpler PHP backend without Laravel

      - name: Health check
        run: |
          echo "Checking production health..."
          response=$(curl -s https://seoindicator.com/ || echo "failed")
          echo "$response"
          
          if echo "$response" | grep -qi "seoindicator"; then
            echo "✅ Frontend deployed successfully!"
          else
            echo "⚠️ Could not verify deployment"
          fi

  notify:
    needs: [build-and-test, deploy]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=✅ Deployed successfully" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-and-test.result }}" == "failure" ]; then
            echo "status=❌ Build/test failed" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ Deploy failed or skipped" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: echo "${{ steps.status.outputs.status }}"

name: Commit Failed Test Logs

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  commit-failed-logs:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Download Failed Tests Log
      uses: actions/download-artifact@v4
      with:
        name: failed-tests-log
        path: ./test-logs/
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        repository: ${{ github.repository }}
    
    - name: Create Test Logs Directory
      run: mkdir -p test-logs
    
    - name: Move and Format Log File
      run: |
        if [ -f "test-logs/failed-tests.md" ]; then
          # Create a timestamped filename
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          COMMIT_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          FILENAME="test-logs/failed_tests_${TIMESTAMP}_${COMMIT_SHORT}.md"
          
          # Move and enhance the log file
          mv test-logs/failed-tests.md "$FILENAME"
          
          # Add header with more context
          {
            echo "# Failed Tests Report"
            echo ""
            echo "**Workflow Run**: [${{ github.event.workflow_run.html_url }}](${{ github.event.workflow_run.html_url }})"
            echo "**Commit**: [${{ github.event.workflow_run.head_sha }}](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})"
            echo "**Branch**: ${{ github.event.workflow_run.head_branch }}"
            echo "**Date**: $(date)"
            echo ""
            echo "---"
            echo ""
            cat "$FILENAME"
          } > "$FILENAME.tmp" && mv "$FILENAME.tmp" "$FILENAME"
        fi
    
    - name: Commit Failed Test Log
      if: github.event.workflow_run.conclusion == 'failure'
      run: |
        if [ -f test-logs/failed_tests_*.md ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add test-logs/
          git commit -m "Add failed test log from workflow run ${{ github.event.workflow_run.id }}"
          
          # Push to a dedicated branch for failed tests
          git push origin HEAD:failed-tests-logs || echo "Failed to push to failed-tests-logs branch"
        fi

name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: playwright-browsers-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-browsers-
    
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium-headless-shell --with-deps
    
    - name: Run Playwright tests
      run: |
        npx playwright test --max-failures=1 2>&1 | tee test-output.log
        exit ${PIPESTATUS[0]}
    
    - name: Generate Failed Tests Log
      if: failure()
      run: |
        echo "# Failed Tests Report - $(date)" > failed-tests.md
        echo "" >> failed-tests.md
        echo "## Test Run Summary" >> failed-tests.md
        echo "- **Date**: $(date)" >> failed-tests.md
        echo "- **Commit**: ${{ github.sha }}" >> failed-tests.md
        echo "- **Branch**: ${{ github.ref_name }}" >> failed-tests.md
        echo "- **Workflow**: ${{ github.workflow }}" >> failed-tests.md
        echo "" >> failed-tests.md
        echo "## Test Output" >> failed-tests.md
        echo "" >> failed-tests.md
        
        # Capture the test output
        if [ -f "test-output.log" ]; then
          echo "### Console Output" >> failed-tests.md
          echo '```' >> failed-tests.md
          # Get the last 50 lines of output (usually contains the error)
          tail -50 test-output.log >> failed-tests.md
          echo '```' >> failed-tests.md
          echo "" >> failed-tests.md
        fi
        
        # Extract failed test information from HTML report if it exists
        if [ -f "playwright-report/index.html" ]; then
          echo "### Test Results" >> failed-tests.md
          echo "Detailed HTML report available in artifacts." >> failed-tests.md
          echo "" >> failed-tests.md
        fi
        
        # Add any error logs if they exist
        if [ -d "test-results" ] && [ "$(ls -A test-results)" ]; then
          echo "### Error Details" >> failed-tests.md
          find test-results -name "*.txt" -o -name "*.log" | head -5 | while read file; do
            echo "**File**: \`$file\`" >> failed-tests.md
            echo '```' >> failed-tests.md
            head -20 "$file" >> failed-tests.md
            echo '```' >> failed-tests.md
            echo "" >> failed-tests.md
          done
        fi
        
        # Add browser and system information
        echo "### Environment Information" >> failed-tests.md
        echo "- **OS**: $(uname -a)" >> failed-tests.md
        echo "- **Node Version**: $(node --version)" >> failed-tests.md
        echo "- **Playwright Version**: $(npx playwright --version)" >> failed-tests.md
        echo "- **Browser**: Chromium Headless Shell" >> failed-tests.md
        echo "" >> failed-tests.md
        
        echo "## Next Steps" >> failed-tests.md
        echo "1. Check the HTML report in artifacts for detailed information" >> failed-tests.md
        echo "2. Review test code and fix identified issues" >> failed-tests.md
        echo "3. Re-run tests locally: \`npm test\`" >> failed-tests.md
        echo "4. Check the console output above for specific error messages" >> failed-tests.md
    
    - name: Upload Failed Tests Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failed-tests-log
        path: failed-tests.md
        retention-days: 30
    
    - name: Commit Failed Test Log to Repository
      if: failure()
      run: |
        if [ -f "failed-tests.md" ]; then
          # Create timestamped filename
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          FILENAME="test-logs/failed_tests_${TIMESTAMP}_${COMMIT_SHORT}.md"
          
          # Create test-logs directory if it doesn't exist
          mkdir -p test-logs
          
          # Move and enhance the log file
          mv failed-tests.md "$FILENAME"
          
          # Add header with more context
          {
            echo "# Failed Tests Report"
            echo ""
            echo "**Workflow Run**: [${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "**Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Branch**: ${{ github.ref_name }}"
            echo "**Date**: $(date)"
            echo ""
            echo "---"
            echo ""
            cat "$FILENAME"
          } > "$FILENAME.tmp" && mv "$FILENAME.tmp" "$FILENAME"
          
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add and commit the log file
          git add "$FILENAME"
          git commit -m "Add failed test log from workflow run ${{ github.run_id }}" || echo "No changes to commit"
          
          # Push to the repository
          git push origin HEAD:${{ github.ref_name }} || echo "Failed to push changes"
        fi
    
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Fail workflow if tests failed
      if: failure()
      run: |
        echo "Tests failed - workflow will show as failed"
        exit 1

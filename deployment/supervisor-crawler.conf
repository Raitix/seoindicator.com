# =============================================================================
# Supervisor Configuration for Crawler Queue Workers
# =============================================================================
# 
# This configuration manages the crawler queue workers for the SEOIndicator
# headless crawler service. Place this file in /etc/supervisor/conf.d/ on
# your production server.
#
# Task: TASK-22-16 - Queue Integration with JobQueue
# Feature: FEAT-022 - Headless Crawler Service
#
# Installation:
#   sudo cp supervisor-crawler.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#
# Commands:
#   sudo supervisorctl start crawler-worker:*
#   sudo supervisorctl stop crawler-worker:*
#   sudo supervisorctl restart crawler-worker:*
#   sudo supervisorctl status crawler-worker:*
#
# Or use the artisan commands:
#   php artisan crawler:restart   # Restart all workers gracefully
#   php artisan crawler:status    # Show queue status
#   php artisan crawler:clear     # Clear pending jobs
#
# =============================================================================

[program:crawler-worker]
# Process name template (creates multiple instances)
process_name=%(program_name)s_%(process_num)02d

# Command to run the queue worker
# --queue=crawler-high,crawler,crawler-low: Process high priority first, then normal, then low
# --sleep=3: Wait 3 seconds between jobs
# --tries=1: Only attempt jobs once (configured in CrawlWorker)
# --timeout=360: Maximum time for a job (should be > job timeout of 300s)
# --max-time=3600: Restart worker after 1 hour (prevents memory leaks)
# --memory=256: Restart if memory exceeds 256MB
command=php %(app_path)s/artisan queue:work database --queue=crawler-high,crawler,crawler-low --sleep=3 --tries=1 --timeout=360 --max-time=3600 --memory=256

# Auto-start on system boot
autostart=true

# Auto-restart on failure
autorestart=true

# User to run the process as (should match web server user)
user=www-data

# Number of worker processes to start
# Adjust based on server resources and crawl load
numprocs=2

# Redirect stderr to stdout
redirect_stderr=true

# Log file locations
stdout_logfile=/var/log/crawler-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

# Stop signal (SIGTERM allows graceful shutdown)
stopasgroup=true
stopsignal=SIGTERM

# Priority (lower = higher priority)
priority=999

# Environment variables
environment=DISPLAY=":0"

# =============================================================================

# Optional: High-priority worker (processes crawler-high only)
# Uncomment if you need dedicated high-priority workers
#
# [program:crawler-worker-high]
# process_name=%(program_name)s_%(process_num)02d
# command=php %(app_path)s/artisan queue:work database --queue=crawler-high --sleep=3 --tries=1 --timeout=360 --max-time=3600 --memory=256
# autostart=true
# autorestart=true
# user=www-data
# numprocs=1
# redirect_stderr=true
# stdout_logfile=/var/log/crawler-worker-high.log
# stdout_logfile_maxbytes=50MB
# stdout_logfile_backups=10
# stopasgroup=true
# stopsignal=SIGTERM
# priority=100

# =============================================================================

# Optional: Low-priority worker (processes crawler-low only)
# Uncomment if you need dedicated low-priority workers for background re-crawls
#
# [program:crawler-worker-low]
# process_name=%(program_name)s_%(process_num)02d
# command=php %(app_path)s/artisan queue:work database --queue=crawler-low --sleep=3 --tries=1 --timeout=360 --max-time=3600 --memory=256
# autostart=true
# autorestart=true
# user=www-data
# numprocs=1
# redirect_stderr=true
# stdout_logfile=/var/log/crawler-worker-low.log
# stdout_logfile_maxbytes=50MB
# stdout_logfile_backups=10
# stopasgroup=true
# stopsignal=SIGTERM
# priority=999

# =============================================================================
# Configuration Notes:
# =============================================================================
#
# 1. Replace %(app_path)s with your actual application path:
#    Example: /var/www/seoindicator.com/current
#
# 2. Adjust numprocs based on:
#    - Server CPU cores (1-2 workers per core)
#    - Memory available (each worker uses ~100-200MB)
#    - Playwright browser instances (each crawl opens a browser)
#
# 3. Queue processing order:
#    - crawler-high: Manual user-initiated crawls (priority 100)
#    - crawler: Scheduled/system crawls (default priority)
#    - crawler-low: Background re-crawls (low priority)
#
# 4. Memory management:
#    - Each worker is limited to 256MB (--memory=256)
#    - Workers restart after 1 hour (--max-time=3600)
#    - This prevents memory leaks from accumulating
#
# 5. Graceful shutdown:
#    - stopasgroup=true: Stop all child processes
#    - stopsignal=SIGTERM: Allow workers to finish current job
#
# 6. Playwright requirements:
#    - Ensure Chromium/Chrome is installed
#    - Set DISPLAY environment variable if running headed
#    - For headless mode, Playwright handles this automatically
#
# =============================================================================
